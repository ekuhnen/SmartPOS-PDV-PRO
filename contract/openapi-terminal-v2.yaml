openapi: 3.0.3

# =====================================================================
# PILOT-STAB-03B.7A2 — TERMINAL CASH CONTRACT COMPLETION
#
# This file documents the CASH-SESSION API **as deployed today** in the
# backend (Edge Function `api-caixa` + the SQL authority it calls).
# It invents nothing. 7A1 listed seven contract debts; 7A2 closed all
# seven in the BACKEND, and this revision describes the closed state.
#
# Source of truth used to write this document:
#   supabase/functions/api-caixa/index.ts
#   supabase/functions/_shared/idempotency.ts
#   public.caixa_current_session(uuid, text, text)
#   public.open_caixa_session(uuid, uuid, text, text, numeric, text, text, uuid)
#   public.register_caixa_cash_movement(uuid, text, numeric, text, text, uuid, text, text)
#   public.caixa_session_cash_position(uuid)
#   public.caixa_session_payments(uuid)
#   public.caixa_session_close_preview(uuid)
#   public.close_caixa_session(uuid, jsonb, text, uuid, text)
#   public.caixa_operacoes, public.caixa_session_closures
#
# Backend behaviour changed by this stage: additive only. No existing
# request shape, field name or status code was altered, so the deployed
# Android build keeps working untouched.
# =====================================================================

info:
  title: PlugPDV Terminal API — Cash Session + Pay-by-Items (deployed contract)
  version: "2.4.0-01A2"
  description: |
    Terminal-facing contract for the cash session (caixa).

    ## Session identity
    A cash session **is** the `ABERTURA` (opening) row of `caixa_operacoes`.
    `session_id` is therefore the id of that opening operation. Every later
    movement of the session carries `caixa_session_id = session_id`.
    Closing inserts a `FECHAMENTO` row with `valor = 0` — closing is an
    event, never a cash movement.

    ## Money transport (normative)
    Every monetary field on the wire is a **JSON decimal number** (never a
    string, never integer minor units). It comes from a PostgreSQL
    `numeric` column/expression, already rounded by the database with
    `round_money`/`round_cash` for the currency of the record.
    The terminal MUST NOT multiply by 100 to guess minor units: PYG and CLP
    have 0 decimals, BRL/USD/EUR have 2. If the Android domain layer wants
    `Long` minor units it must scale using the ISO minor-unit count of the
    `currency` field that accompanies the amount, and must never re-round.

    ## Currency rules (normative)
    * Currency is an ISO-4217 uppercase 3-letter code, validated as
      `^[A-Z]{3}$`.
    * Currency is a first-class attribute of each operation and of each
      position line. It is immutable after insert.
    * There is **no FX** anywhere in cash accounting: no conversion, no
      cross-currency addition, no "grand total".
    * Historical/closed session values are served from the frozen closure
      snapshot and must never be re-rendered with the company/default
      currency.

    ## Auth
    Every request requires `Authorization: Bearer <access token>`.
    The backend derives the tenant (owner) and the operator from the token;
    the terminal never sends an owner id. Sub-users must hold the
    `smart_pos` or `sales` module permission.
    Additional deployed gates (unchanged by this document):
    `X-Device-Id` (device kill-switch), `X-Api-Version` / `X-App-Version`
    (version gate → `426 UPGRADE_REQUIRED`).

servers:
  - url: https://ypvcxgkzolzxggfrmzlz.supabase.co/functions/v1
    description: Deployed Edge Functions base URL

x-money-transport:
  json_type: number
  representation: decimal
  minor_units_on_wire: false
  rounding: performed in the database, per the currency of the record
  currency_association: every amount is paired with a sibling `currency` field
    (or belongs to a position/summary line keyed by `currency`)

x-idempotency:
  summary: |
    Cash operations that CREATE money facts are idempotent by
    `Idempotency-Key`. The authority is the database
    (`terminal_operations` + `terminal_op_begin` / `terminal_op_complete`),
    exactly like the rest of the terminal API; `api-caixa` only translates the
    verdict into HTTP and stores the response for replay.
  header: "Idempotency-Key: <string, unique per device>"
  requires: the key is only honoured together with `X-Device-Id`.
  protected_actions: [abrir, sangria, pay_in, cash_refund, fechar]
  semantics:
    first_call: executed normally (200/201).
    replay_same_key_same_body: "the stored response, plus header `X-Idempotent-Replay: true`."
    replay_same_key_different_body: 409 `IDEMPOTENCY_CONFLICT`.
    same_key_still_running: 409 `OPERATION_IN_PROGRESS`.
    no_key: executes without replay protection (compatible with older clients).
  abrir:
    idempotent: true
    extra_guard: single-open-session. A second `abrir` while a session is open
      returns 409 `CASH_SESSION_ALREADY_OPEN` with the open `session_id`.
  sangria:
    idempotent: true
    note: a retried request with the same key NO LONGER creates a second withdrawal.
  pay_in:
    idempotent: true
  cash_refund:
    idempotent: true
  fechar:
    idempotent: true
    mechanism: >-
      convergent by state AND by key. If the session is already closed the RPC
      returns the frozen snapshot with `already_closed: true` and HTTP 200
      (first close returns 201). Closing is never a cash movement.
  preview_fechamento:
    idempotent: true
    note: read-only, no key needed.

x-contract-debt-closed:
  - id: CONTRACT_DEBT-1
    area: idempotency
    resolution: |
      `abrir`, `sangria`, `pay_in`, `cash_refund` and `fechar` now open a
      `terminal_operations` record (`caixa.*` operation types) via
      `_shared/idempotency.ts`. Replay returns the stored response.
  - id: CONTRACT_DEBT-2
    area: pay-in / reforço
    resolution: |
      new action `pay_in`, backed by
      `public.register_caixa_cash_movement(..., 'PAY_IN', ...)`.
  - id: CONTRACT_DEBT-3
    area: cash refund
    resolution: |
      new action `cash_refund`, backed by
      `public.register_caixa_cash_movement(..., 'CASH_REFUND', ...)`.
  - id: CONTRACT_DEBT-4
    area: error contract
    resolution: |
      every business error now returns `{ error, code, message, message_key }`.
      Unknown database exceptions are the only 500 (`INTERNAL_ERROR`) and are
      never leaked verbatim.
  - id: CONTRACT_DEBT-5
    area: session read
    resolution: |
      `GET /api-caixa?current_session=1[&terminal_id=]` →
      `public.caixa_current_session`. Returns `{ session: null }` when no
      session is open. The terminal no longer infers state from history.
  - id: CONTRACT_DEBT-6
    area: terminal identity
    resolution: |
      the terminal id is read from `X-Terminal-Id`, the body field
      `terminal_id`, or (fallback) `X-Device-Id`, and is persisted by
      `open_caixa_session`. Every movement of the session inherits it.
  - id: CONTRACT_DEBT-7
    area: opening validation
    resolution: |
      `open_caixa_session` validates the amount (finite, >= 0, <= 1e12) and the
      currency (ISO shape AND enabled for the company via
      `company_currency_enabled`), raising `INVALID_AMOUNT` /
      `INVALID_CURRENCY`. When `moeda` is omitted the company default currency
      is used — never a hardcoded BRL.

x-cash-currency-invariant: |
  The opening defines the currency of the drawer. A movement sent with a
  different currency is REFUSED with 422 `CASH_CURRENCY_MISMATCH` — it must
  never create a second-currency line in the cash position. Sending no
  currency inherits the session currency. There is no FX in cash accounting.

x-items-payment-idempotency: |
  `payment_quote` is a pure read: no `terminal_operations` row, no payment,
  no allocation, no audit event, no cash receipt. It may be called as often
  as the UI needs.

  `checkout_commit` is durable and idempotent in the DATABASE
  (`terminal_op_begin`/`terminal_op_complete` over `terminal_operations`,
  unique per device + `Idempotency-Key`). Replaying the same key with the
  same body returns the stored response with `X-Idempotent-Replay: true`:
  exactly one `pagamentos_comanda` row, one set of
  `comanda_payment_allocations` (`allocation.skipped = true`), one cash
  receipt and one `eventos_auditoria` PAGAMENTO event. Same key with a
  different body → 409 `IDEMPOTENCY_KEY_CONFLICT`.

paths:
  # =================================================================
  # PILOT-STAB-04L1 — AUTH LOGIN CASHIER CONTRACT (documentation only)
  # Describes `supabase/functions/auth-login/index.ts` AS DEPLOYED.
  # Nothing here is new behaviour; no field is invented.
  # =================================================================
  /auth-login:
    post:
      operationId: terminalAuthLogin
      summary: Terminal login — session, tenant, operation modes, device and authoritative cashier state
      security: []
      description: |
        Single deployed login call for the terminal. The success payload is only
        produced AFTER, in this order:

        1. credential authentication (`signInWithPassword`);
        2. tenant/owner resolution (real owner, or `owner_user_id` of a sub-user);
        3. user active/block validation (`user_denied` → 401);
        4. device ownership/block validation (`device_owner_mismatch`,
           `DEVICE_BLOCKED` → 403);
        5. authoritative cashier-session read (`public.caixa_current_session`
           via `public.terminal_login_bootstrap`).

        Steps 2–5 are ONE database round trip (`terminal_login_bootstrap`,
        read-only). A failure of that read is 503 `LOGIN_BOOTSTRAP_FAILED` —
        never a 200. Non-authoritative telemetry (`last_seen_at`,
        `app_version`, `user_agent`) runs after the response.

        Only `POST` is accepted (`405 { "error": "Method not allowed" }`).
      parameters:
        - in: header
          name: X-Device-Id
          required: false
          schema: { type: string }
          description: |
            Terminal device id. When present the device is validated and
            auto-registered on first login; when absent, `device` is `null`.
        - in: header
          name: X-App-Version
          required: false
          schema: { type: string }
        - in: header
          name: X-Platform
          required: false
          schema: { type: string, enum: [android, ios, web] }
          description: Anything else is stored as `web`.
        - in: header
          name: X-Device-Label
          required: false
          schema: { type: string }
        - in: header
          name: X-Terminal-Id
          required: false
          schema: { type: string }
          description: |
            PILOT-STAB-04L3. Optional cash-terminal scope for the authoritative
            cashier read, with the SAME semantics as
            `GET /api-caixa?current_session=1[&terminal_id=]`. When absent, no
            terminal filter is applied and the open session of the tenant is
            returned. `X-Device-Id` is NOT used as a terminal filter: a session
            opened on another device of the same tenant is still reported open.

      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginRequest" }
      responses:
        "200":
          description: Authenticated. Response headers include `X-Request-Id` and `Server-Timing`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthLoginResponse" }
        "400":
          description: '`{ "error": "email and password are required", "reason": "MISSING_FIELDS" }`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthLoginError" }
        "401":
          description: |
            `{ "error": "Invalid email or password", "reason": <REASON> }` — the
            message is deliberately identical for every reason.
            `reason` ∈ `INVALID_CREDENTIALS`, `EMAIL_NOT_CONFIRMED`,
            `USER_BANNED` (credential layer), `USER_INACTIVE`, `USER_BLOCKED`
            (sub-user denied by the tenant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthLoginError" }
        "403":
          description: |
            Device refused, fail-closed: `device_owner_mismatch` (device belongs
            to another tenant) or `DEVICE_BLOCKED`. Both carry the same value in
            `error` and `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthLoginDeviceError" }
        "405":
          description: '`{ "error": "Method not allowed" }`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainError" }
        "429":
          description: '`{ "error": "Too many login attempts. Try again in 1 minute." }` — 10 requests/minute per IP.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainError" }
        "503":
          description: |
            `{ "error": "Internal server error", "code": "LOGIN_BOOTSTRAP_FAILED" }`
            — the authoritative bootstrap read (tenant, modes, device, cashier)
            failed. The terminal MUST treat this as "not logged in" and retry;
            it is never a partial success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "500":
          description: '`{ "error": "Internal server error" }`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainError" }

  /api-caixa:
    get:
      operationId: cashHistoryOrCashPosition
      summary: Session/movement history, or physical cash position of one session
      description: |
        Three deployed behaviours on the same path:

        * `?current_session=1` → the CURRENT OPEN session of the authenticated
          operator (optionally scoped by `terminal_id`), or `{ session: null }`.
          This is the canonical way the terminal recovers its state after a
          restart. It never guesses from history.
        * `?cash_position_session_id=<uuid>` → physical cash position of that
          session, per currency (no FX).
        * otherwise → list of `caixa_operacoes` rows of the authenticated
          tenant, newest first, plus per-currency aggregates
          (`totals_by_currency`, never a mixed grand total).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: current_session
          in: query
          schema: { type: string, example: "1" }
          description: |
            Any truthy value selects the current-open-session read. Takes
            precedence over every other parameter.
        - name: terminal_id
          in: query
          schema: { type: string }
          description: |
            Only with `current_session`. Restricts the lookup to a session
            opened by that terminal. Falls back to the `X-Terminal-Id` header.
        - name: cash_position_session_id
          in: query
          schema: { type: string, format: uuid }
          description: When present, the history parameters are ignored.
        - name: date
          in: query
          schema: { type: string, example: "2026-09-04" }
          description: Filters `created_at` between `<date>T00:00:00` and `<date>T23:59:59`.
        - name: operator_id
          in: query
          schema: { type: string }
        - name: tipo
          in: query
          schema:
            type: string
            enum: [ABERTURA, SANGRIA, FECHAMENTO, SUPRIMENTO, REFORCO, PAY_IN, DEVOLUCAO, ESTORNO_DINHEIRO, CASH_REFUND]
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: History, or cash position when `cash_position_session_id` is used.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CurrentSessionResponse"
                  - $ref: "#/components/schemas/CashPositionResponse"
                  - $ref: "#/components/schemas/CashHistoryResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/PlainServerError" }

    post:
      operationId: cashAction
      summary: Cash session actions (action-based POST)
      description: |
        Single endpoint, discriminated by the `action` field.
        Deployed actions: `abrir`, `sangria`, `pay_in`, `cash_refund`,
        `fechar`, `preview_fechamento`. Any other value returns 400
        `UNKNOWN_ACTION` with the list of valid actions.

        Send `Idempotency-Key` (with `X-Device-Id`) on every action that
        creates a fact — see `x-idempotency`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
          description: Unique per device. Replay returns the stored response.
        - name: X-Terminal-Id
          in: header
          required: false
          schema: { type: string }
          description: Terminal identity persisted on the opening; falls back to `X-Device-Id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AbrirRequest"
                - $ref: "#/components/schemas/SangriaRequest"
                - $ref: "#/components/schemas/PayInRequest"
                - $ref: "#/components/schemas/CashRefundRequest"
                - $ref: "#/components/schemas/FecharRequest"
                - $ref: "#/components/schemas/PreviewFechamentoRequest"
              discriminator: { propertyName: action }
            examples:
              abrir_pyg:
                summary: Open with Gs. 15.000
                value: { action: abrir, valor: 15000, moeda: PYG, observacao: "Fundo de troco" }
              sangria_pyg:
                summary: Withdraw Gs. 5.000
                value: { action: sangria, session_id: "00000000-0000-0000-0000-000000000000", valor: 5000, observacao: "Sangria para cofre" }
              pay_in_pyg:
                summary: Cash pay-in / reforço of Gs. 3.000
                value: { action: pay_in, session_id: "00000000-0000-0000-0000-000000000000", valor: 3000, observacao: "Reforço de troco", reference: "REF-1" }
              cash_refund_pyg:
                summary: Cash refund of Gs. 1.000 given back to a customer
                value: { action: cash_refund, session_id: "00000000-0000-0000-0000-000000000000", valor: 1000, observacao: "Devolução ao cliente", reference: "venda-123" }
              preview:
                value: { action: preview_fechamento, session_id: "00000000-0000-0000-0000-000000000000" }
              fechar_counted:
                summary: Close declaring a physical count in PYG
                value:
                  action: fechar
                  session_id: "00000000-0000-0000-0000-000000000000"
                  observacao: "Fechamento do turno"
                  counted_by_currency:
                    - { currency: PYG, counted_amount: 10000 }
              fechar_no_count:
                summary: Close WITHOUT declaring any count
                value: { action: fechar, session_id: "00000000-0000-0000-0000-000000000000" }
      responses:
        "200":
          description: |
            `preview_fechamento`, `fechar` on an already-closed session
            (`already_closed: true`), or an idempotent replay of any action
            (with `X-Idempotent-Replay: true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSnapshot" }
        "201":
          description: |
            Fact created: `abrir` (session), `sangria` / `pay_in` /
            `cash_refund` (movement), or first `fechar` of the session.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CashMovementResult"
                  - $ref: "#/components/schemas/SessionSnapshot"
        "400":
          description: |
            `SESSION_ID_REQUIRED`, `UNKNOWN_ACTION` (with `valid_actions`), or
            `device_id_required` from the device gate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "403":
          description: |
            `USER_BLOCKED`, `MODULE_FORBIDDEN`, `DEVICE_BLOCKED`,
            `device_not_registered`, or `FORBIDDEN_TENANT` when the session
            belongs to another tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "404":
          description: "`CASH_SESSION_NOT_FOUND` — unknown id, other tenant, or not an ABERTURA row."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "409":
          description: |
            `CASH_SESSION_ALREADY_OPEN` (a session is already open — body
            carries the open `session_id`), `CASH_SESSION_CLOSED`,
            `IDEMPOTENCY_CONFLICT` (same key, different body),
            `OPERATION_IN_PROGRESS` (same key still running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
        "422":
          description: Typed business validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }
              examples:
                bad_amount: { value: { error: "Amount must be a finite decimal within the allowed range", code: INVALID_AMOUNT, message_key: cash.error.invalid_amount } }
                bad_currency: { value: { error: "Currency is invalid or not enabled for this company", code: INVALID_CURRENCY, message_key: cash.error.invalid_currency } }
                currency_mismatch: { value: { error: "Cash movement currency must match the session opening currency", code: CASH_CURRENCY_MISMATCH, message_key: cash.error.cash_currency_mismatch } }
                bad_type: { value: { error: "Cash movement type is not supported", code: CASH_MOVEMENT_TYPE_INVALID, message_key: cash.error.cash_movement_type_invalid } }
                not_array: { value: { error: "counted_by_currency must be an array", code: COUNTED_INVALID } }
                count_currency: { value: { error: "Invalid currency in counted_by_currency", code: COUNTED_CURRENCY_INVALID } }
                count_amount: { value: { error: "Invalid counted_amount", code: COUNTED_AMOUNT_INVALID } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "500":
          description: "`INTERNAL_ERROR` — unexpected failure; never leaks the database message."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodedError" }

  /api-comandas:
    post:
      operationId: comandaTerminalActions
      summary: Item-payment preview (`payment_quote`), ITEMS checkout commit (`checkout_commit`), customer identity (`set_customer`) and service fee (`set_service_fee`)
      description: |
        Action-based endpoint (`{ "action": "...", ... }` in the POST body).
        Only the actions required by pay-by-items (PILOT-STAB-04H), comanda
        identity (04M1) and the service fee (04N) are documented here, exactly
        as deployed in `supabase/functions/api-comandas/index.ts`.

        ## Service fee authority (normative — PILOT-STAB-04N)
        `action: "set_service_fee"` is the ONLY way to write the comanda
        service fee. The DATABASE
        (`public.set_comanda_service_fee`) is the authority:

        ```text
        percentage base = comandas.total_bruto - comandas.total_descontos
                          (merchandise minus discount, BEFORE tax)
        service_fee     = round_money(base * percentage / 100, comanda currency)   -- mode "percentage"
        service_fee     = round_money(amount, comanda currency)                    -- mode "amount"
        total_liquido   = total_bruto - total_descontos + tax_amount + service_fee
        ```

        The terminal NEVER computes the authoritative fee or the total: it
        sends the intent and reads `service_fee`, `tax_amount` and
        `total_liquido` already computed. There is **no implicit FX** for the
        service fee: `mode: "amount"` is expressed in `comandas.currency`, and
        a declared `currency` different from it is refused (422
        `SERVICE_FEE_CURRENCY_MISMATCH`) instead of being converted.
        Setting `percentage: 0` or `amount: 0` REMOVES the fee.
        One logical mutation = one `versao` bump.


        ## Money authority (normative)
        The terminal is NEVER the monetary authority. The selected items are
        the ONLY monetary input. The database computes, from
        `public.comanda_items_payment_quote`:

        ```text
        line_subtotal   = telescopic share of comandas.total_bruto
        line_discount   = telescopic share of comandas.total_descontos
        line_tax        = telescopic share of comandas.tax_amount
        line_service    = telescopic share of comandas.total_taxas
        coverage_amount = line_subtotal - line_discount + line_tax + line_service
        accounting_total = SUM(coverage_amount)      -- comanda currency
        transaction_amount = round_money(accounting_total * fx_rate, transaction_currency)
        cash_tender        = round_cash_for_payment(transaction_amount, ...)   -- CASH only
        ```

        Shares are cumulative-by-gross-subtotal, so when every quantity is
        paid the coverages telescope to exactly `comandas.total_liquido`.

        ## Cash vs non-cash (normative)
        Cash denomination rounding is applied ONLY to the physical tender
        (`cash_tender`). Accounting coverage (`accounting_total`) is never
        rounded to cash increments. For `PIX_TRANSFERENCIA`, `CARTAO`,
        `VOUCHER` and `OUTRO`, `cash_tender == transaction_amount` and
        `cash_rounding_diff == 0`.

        ## Allocation identity (normative)
        An allocation is identified by `comanda_item_id` + `quantity`.
        Product id/name are NEVER allocation identity: two lines of the same
        product are two independent `comanda_item_id`s, and one line with
        `qtd = 2` may be paid one unit at a time.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: |
            REQUIRED for `checkout_commit` (400 `IDEMPOTENCY_KEY_REQUIRED`
            otherwise). MUST NOT be used for `payment_quote`, which is a pure
            read with no financial effect. Uniqueness scope is
            (device, key) in `public.terminal_operations`.
            OPTIONAL for `set_service_fee`: protection is enabled only when
            BOTH `Idempotency-Key` and `X-Device-Id` are present. In that case
            the request fingerprint is `{action, comanda_id, mode, percentage,
            amount}` and a replay of the same key returns the STORED body with
            header `X-Idempotent-Replay: true`; the same key with a different
            fingerprint is refused by the database
            (`IDEMPOTENCY_KEY_REUSED`, 409), and a retry while the first call
            is still running returns `OPERATION_IN_PROGRESS` (409). Without the
            pair, the mutation runs unprotected (legacy-compatible) — the CAS
            field `expected_comanda_version` is then the only guard.
        - name: X-Device-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: |
            REQUIRED for `checkout_commit` (400 `DEVICE_REQUIRED`). Malformed
            uuid → 400 `device_id_invalid`; unknown → 403
            `device_not_registered`; blocked → 403 `DEVICE_BLOCKED`; owner
            mismatch → 403 `TENANT_DEVICE_MISMATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PaymentQuoteRequest"
                - $ref: "#/components/schemas/ItemsCheckoutCommitRequest"
                - $ref: "#/components/schemas/SetComandaCustomerRequest"
                - $ref: "#/components/schemas/SetComandaServiceFeeRequest"
              discriminator:
                propertyName: action
            examples:
              payment_quote_cash:
                summary: Preview of Heineken x1 in a PYG comanda, CASH
                value:
                  action: payment_quote
                  comanda_id: 4332681a-15f8-4a71-9603-3586a975b20c
                  items: [{ comanda_item_id: 8f1c…, quantity: 1 }]
                  forma: DINHEIRO
                  moeda: PYG
              checkout_commit_items:
                summary: ITEMS-mode commit (no client amount)
                value:
                  action: checkout_commit
                  comanda_id: 4332681a-15f8-4a71-9603-3586a975b20c
                  items: [{ comanda_item_id: 8f1c…, quantity: 1 }]
                  forma: DINHEIRO
                  moeda: PYG
              set_service_fee_percentage:
                summary: 10% service fee (percentage mode) with CAS
                value:
                  action: set_service_fee
                  comanda_id: 4332681a-15f8-4a71-9603-3586a975b20c
                  mode: percentage
                  percentage: 10
                  expected_comanda_version: 7
              set_service_fee_amount:
                summary: Fixed amount in the comanda currency (no FX)
                value:
                  action: set_service_fee
                  comanda_id: 4332681a-15f8-4a71-9603-3586a975b20c
                  mode: amount
                  amount: 5000
                  currency: PYG
              set_service_fee_zero:
                summary: Remove the service fee
                value:
                  action: set_service_fee
                  comanda_id: 4332681a-15f8-4a71-9603-3586a975b20c
                  mode: percentage
                  percentage: 0
      responses:
        "200":
          description: |
            `payment_quote` result — authoritative, read-only, no mutation —
            or `set_customer` result (identity only, no money effect), or
            `set_service_fee` result (authoritative fee and totals).
          headers:
            X-Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
              description: |
                Present only when `set_service_fee` was replayed from a stored
                operation (same `Idempotency-Key` + `X-Device-Id`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaymentQuoteResponse"
                  - $ref: "#/components/schemas/SetComandaCustomerResponse"
                  - $ref: "#/components/schemas/SetComandaServiceFeeResponse"
        "201":
          description: |
            `checkout_commit` first execution (`outcome: "new"`). A replay of
            the same Idempotency-Key returns the SAME body with header
            `X-Idempotent-Replay: true` and the stored status code.
          headers:
            X-Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
              description: Present only on replay of a stored operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsCheckoutCommitResponse" }
        "400":
          description: |
            `ALLOCATION_PAYLOAD_INVALID`, `ALLOCATION_ITEMS_REQUIRED`,
            `ALLOCATION_ITEM_NOT_IN_COMANDA`, `ALLOCATION_QUANTITY_INVALID`,
            `IDEMPOTENCY_KEY_REQUIRED`, `DEVICE_REQUIRED`, `device_id_invalid`,
            `SERVICE_FEE_MODE_INVALID` (`mode` outside
            `percentage`/`amount` — `set_service_fee`), and a plain
            `{"error":"comanda_id is required"}` when `comanda_id` is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "403":
          description: |
            `device_not_registered`, `DEVICE_BLOCKED`, `TENANT_DEVICE_MISMATCH`,
            `FORBIDDEN_TENANT`, `CUSTOMER_TENANT_MISMATCH` (customer of another
            company — `set_customer`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "404":
          description: "`COMANDA_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "409":
          description: |
            `ALLOCATION_EXCEEDS_ITEM_QUANTITY` (item/quantity already paid),
            `ALLOCATION_ITEM_NOT_PAYABLE` (cancelled item),
            `ALLOCATION_NO_PAYABLE_ITEMS`, `COMANDA_CANCELLED`,
            `COMANDA_ALREADY_CLOSED` (outcome `reconciliation`),
            `COMANDA_FINALIZED` (identity is immutable after closure —
            `set_customer`),
            `IDEMPOTENCY_KEY_CONFLICT` (same key, different `request_hash`),
            `INSUFFICIENT_STOCK`,
            `COMANDA_NOT_EDITABLE` (status outside
            ABERTA/EM_CONSUMO/AGUARDANDO_PAGAMENTO — body carries
            `status_atual`), `STALE_COMANDA_REVISION` (body carries `current`),
            `SERVICE_FEE_LOCKED_BY_ALLOCATION` (a CONFIRMADO payment already
            has allocated items and the fee value would change — repeating the
            SAME value is convergent and accepted),
            `SERVICE_FEE_BELOW_SETTLED` (new total would fall below the amount
            already settled), `IDEMPOTENCY_KEY_REUSED`,
            `OPERATION_IN_PROGRESS`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "422":
          description: |
            `ITEMS_AMOUNT_MISMATCH` (client amount ≠ authoritative amount;
            body carries `expected_accounting_base`,
            `expected_transaction_amount`, `expected_cash_tender`,
            `allocation_preview`), `MONEY_AMOUNT_MISMATCH`,
            `TRANSACTION_CURRENCY_REQUIRED`, `BASE_CURRENCY_MISMATCH`,
            `COMANDA_CURRENCY_MISSING`, `FX_RATE_MISSING`,
            `PAYMENT_METHOD_INVALID`, `ENUM_VALUE_INVALID`,
            `SERVICE_FEE_PERCENT_INVALID` (not a number, negative, or > 100),
            `SERVICE_FEE_AMOUNT_INVALID` (not a number or negative),
            `SERVICE_FEE_CURRENCY_MISMATCH` (declared currency ≠
            `comandas.currency`; body carries `expected`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "503":
          description: "`device_check_failed` — device registry unavailable (never used for a malformed id)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
    get:
      operationId: comandaReceipt
      summary: Receipt read (`?recibo=<comanda_id>`) with issuer and customer fiscal identity
      description: |
        Pure read of `supabase/functions/api-comandas/index.ts`. Additive in
        PILOT-STAB-04M1: the existing `empresa` object is preserved
        byte-for-byte; `issuer`, `issuer_source`, `customer`, `customer_source`
        and `customer_id` are NEW fields.

        ## Identity authority (normative)
        Identity comes from the DATABASE only
        (`public.comanda_receipt_identity`). The terminal never composes the
        issuer or the customer from local state, and never edits either on a
        finalized comanda.

        * `issuer` = the company of the comanda owner
          (`public.build_issuer_identity`). `document_type` is `RUC` when a RUC
          exists, otherwise `DOCUMENT`.
        * `customer` = the linked master customer
          (`public.build_customer_identity`, `source: customer_master`) or a
          free-text name (`source: free_text`). A comanda without a customer is
          valid: `customer: null`, `customer_source: "none"`.
        * `*_source: "snapshot"` — identity was FROZEN at closure/cancellation
          and never changes when master data changes afterwards.
        * `*_source: "live"` — comanda still open, identity resolved live.
        * `issuer_source: "live_legacy_fallback"` — pre-04M1 historical row
          with no snapshot. It is resolved live and LABELLED as such; the
          historical row is never mutated by a read.

        ## Comanda detail read (additive — PILOT-STAB-04N1)
        `GET /api-comandas?id=<comanda_id>` (comanda detail, same function)
        now also exposes `service_fee_mode` and `service_fee_percent` next to
        the authoritative totals it already returned: `subtotal`,
        `total_descontos`, `tax_amount`, `tax_snapshot`, `service_fee`,
        `total_liquido`, `total_pago_base`, `saldo_base` and `versao`. Purely
        additive: no existing field name, type or value changed, so the
        deployed Android build keeps working untouched. The totals are read as
        given — the terminal never re-sums them.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: recibo
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Comanda id whose receipt is requested.
      responses:
        "200":
          description: Receipt payload (money fields unchanged by this stage).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaReceiptResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`FORBIDDEN_TENANT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "404":
          description: "`COMANDA_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }

  /api-restaurant-ops:
    get:
      operationId: restaurantOpsRead
      summary: Salon discovery (read-only). Exact-mesa multi-comanda discovery and interactive search.
      description: |
        WAITER-01A2 — canonical DISCOVERY surface. Read-only, no money authority.

        Two views:

        * `view=tables` (default). With `mesa_id=<uuid>` this is the **exact mesa
          discovery** operation: it returns that single mesa plus the COMPLETE set
          of operationally open comandas on it. The underlying database read
          (`restaurant_ops_tables`) applies no LIMIT and no OFFSET to the comanda
          list, so the set is unbounded-complete by construction. The response
          carries the explicit completeness invariant:
          `discovery_complete = true`, `truncated = false` and, in exact-mesa
          mode, `count_matches = (open_comanda_count == returned_comanda_count)`.
          There is therefore no ambiguity between "one comanda returned" and
          "one comanda exists".
        * `view=search`. Interactive discovery by comanda name, mesa number,
          setor or 8-char control code. `result_count` is the true number of
          matches; `results` may legitimately be bounded by `limit`
          (default 20, max 100). Search MUST NOT be used to decide how many
          comandas a mesa has — after picking a mesa, call exact-mesa discovery.

        Operationally open status set: `ABERTA`, `EM_CONSUMO`,
        `AGUARDANDO_PAGAMENTO`. `FECHADA` and `CANCELADA` never appear.

        Tenant scope comes only from the staff JWT (`resolveTenantContext`);
        `mesa_id` from another tenant returns an empty `tables` array.
        Money values are echoed as produced by the database, per currency
        (`totals_by_currency`), and are never summed across currencies. They are
        display-only: checkout authority stays with the comanda payment actions.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [tables, search], default: tables }
        - name: mesa_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Exact mesa. Enables the complete multi-comanda discovery mode.
        - name: setor
          in: query
          required: false
          schema: { type: string, maxLength: 60 }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 60 }
          description: Required when `view=search`. Name prefix, mesa number, setor or control code.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Search only. Bounds `results`, never `result_count`.
      responses:
        "200":
          description: Discovery payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RestaurantOpsTablesResponse"
                  - $ref: "#/components/schemas/RestaurantOpsSearchResponse"
        "400":
          description: "`SEARCH_QUERY_REQUIRED`, `SEARCH_QUERY_INVALID`, `SEARCH_LIMIT_INVALID`, `MESA_ID_INVALID`, `SETOR_INVALID`, `VIEW_INVALID`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: "`METHOD_NOT_ALLOWED` — this surface is GET only."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComandaCodedError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <supabase access token>`. No token values are
        documented here. Missing/!Bearer → 401 `"Unauthorized"`;
        invalid/expired → 401 `"Invalid or expired token"`.

  responses:
    Unauthorized:
      description: '`{ "error": "Unauthorized" }` or `{ "error": "Invalid or expired token" }` (no code).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlainError" }
    Forbidden:
      description: Deactivated user, missing module permission, or FORBIDDEN_TENANT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CodedError" }
    UpgradeRequired:
      description: 'Version gate rejected the app/API version (`code: UPGRADE_REQUIRED`).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CodedError" }
    PlainServerError:
      description: |
        Generic, no code: `"Failed to fetch operations"`,
        `"Failed to compute cash position"`, `"Failed to open register"`,
        `"Failed to register sangria"`, `"Failed to close register"`,
        `"Failed to build closing preview"`, `"Internal server error"`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlainError" }

  schemas:
    OpsComandaShape:
      type: object
      description: |
        One operationally open comanda, as produced by
        `restaurant_ops_comanda_shape`. Money fields are display-only, already
        rounded in the currency of the record; never re-sum or convert them.
      properties:
        comanda_id: { type: string, format: uuid }
        control_code:
          type: string
          description: First 8 hex chars of the comanda id, uppercase.
        display_name: { type: string, nullable: true, description: Operational guest name (not a fiscal customer). }
        label: { type: string }
        status: { type: string, enum: [ABERTA, EM_CONSUMO, AGUARDANDO_PAGAMENTO] }
        origin: { type: string, description: "`TERMINAL` | `DIGITAL_MENU`." }
        currency: { type: string, nullable: true }
        total: { type: number }
        paid: { type: number }
        remaining: { type: number }
        requires_reconciliation: { type: boolean }
        subtotal: { type: number }
        tax_amount: { type: number }
        service_fee: { type: number }
        total_descontos: { type: number }
        versao: { type: integer, description: Concurrency token for later mutations. }
        opened_at: { type: string, format: date-time }
        pessoas_qtd: { type: integer }
        garcom_id: { type: string, nullable: true }
        order_count: { type: integer }
        kitchen_pending_count: { type: integer }
        kitchen_preparing_count: { type: integer }
        kitchen_ready_count: { type: integer }
        kitchen_delivered_count: { type: integer }
        kitchen_needs_attention: { type: boolean }
    OpsCurrencyTotals:
      type: object
      properties:
        total: { type: number }
        paid: { type: number }
        remaining: { type: number }
        comandas: { type: integer }
    OpsTable:
      type: object
      properties:
        mesa_id: { type: string, format: uuid }
        numero: { type: integer }
        setor: { type: string, nullable: true, description: Physical mesa location — NOT a KDS production station. }
        capacidade: { type: integer }
        status: { type: string }
        admin_status: { type: string }
        operational_status: { type: string, enum: [BLOCKED, IN_USE, FREE] }
        open_comanda_count:
          type: integer
          description: Complete number of operationally open comandas on this mesa.
        open_comandas:
          type: array
          description: Complete list, never truncated. Length equals `open_comanda_count`.
          items: { $ref: "#/components/schemas/OpsComandaShape" }
        totals_by_currency:
          type: object
          description: One block per currency. Never summed across currencies.
          additionalProperties: { $ref: "#/components/schemas/OpsCurrencyTotals" }
    RestaurantOpsTablesResponse:
      type: object
      properties:
        outcome: { type: string, enum: [ok] }
        generated_at: { type: string, format: date-time }
        table_count: { type: integer }
        tables:
          type: array
          items: { $ref: "#/components/schemas/OpsTable" }
        exact_mesa: { type: boolean, description: True when `mesa_id` was supplied. }
        discovery_complete:
          type: boolean
          description: Always true — the comanda list is unbounded-complete.
        truncated: { type: boolean, description: Always false for this surface. }
        open_status_set:
          type: array
          items: { type: string }
          description: "[ABERTA, EM_CONSUMO, AGUARDANDO_PAGAMENTO]."
        mesa_found: { type: boolean, description: Exact-mesa mode only. False for unknown or foreign mesa. }
        open_comanda_count: { type: integer, description: Exact-mesa mode only. }
        returned_comanda_count: { type: integer, description: Exact-mesa mode only. }
        count_matches:
          type: boolean
          description: |
            Exact-mesa mode only. `open_comanda_count == returned_comanda_count`.
            This is the completeness invariant the terminal must assert.
    RestaurantOpsSearchHit:
      allOf:
        - $ref: "#/components/schemas/OpsComandaShape"
        - type: object
          properties:
            mesa_id: { type: string, format: uuid }
            mesa_numero: { type: integer, nullable: true }
            setor: { type: string, nullable: true }
            match_type: { type: string, enum: [control_code, display_name, table] }
    RestaurantOpsSearchResponse:
      type: object
      properties:
        outcome: { type: string, enum: [ok] }
        query: { type: string }
        result_count: { type: integer, description: True match count, independent of `limit`. }
        results:
          type: array
          description: Bounded by `limit`. Not a mesa cardinality source.
          items: { $ref: "#/components/schemas/RestaurantOpsSearchHit" }
    FiscalAddress:
      type: object
      description: Address as frozen/resolved by the database. All fields nullable.
      properties:
        line1: { type: string, nullable: true }
        number: { type: string, nullable: true }
        complement: { type: string, nullable: true }
        neighborhood: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        country: { type: string, nullable: true }
    ReceiptIssuer:
      type: object
      description: |
        Company that issues the receipt (`public.build_issuer_identity`).
        Read-only for the terminal.
      required: [id, document_type, document_number]
      properties:
        id: { type: string, format: uuid }
        legal_name: { type: string, nullable: true }
        trade_name: { type: string, nullable: true }
        document_type: { type: string, enum: [RUC, DOCUMENT] }
        document_number: { type: string, nullable: true }
        ruc: { type: string, nullable: true }
        legacy_document_number: { type: string, nullable: true }
        state_registration: { type: string, nullable: true }
        fiscal_regime: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        country: { type: string, nullable: true }
        address: { $ref: "#/components/schemas/FiscalAddress" }
        frozen_at: { type: string, format: date-time, nullable: true }
    ReceiptCustomer:
      type: object
      description: |
        Customer of the comanda (`public.build_customer_identity`). `null` when
        the comanda has no customer — that is a valid receipt.
      required: [name, source]
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string, nullable: true }
        legal_name: { type: string, nullable: true }
        trade_name: { type: string, nullable: true }
        customer_type: { type: string, nullable: true }
        document_type: { type: string, enum: [RUC, DOCUMENT], nullable: true }
        document_number: { type: string, nullable: true }
        ruc: { type: string, nullable: true }
        legacy_document: { type: string, nullable: true }
        state_registration: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        country: { type: string, nullable: true }
        address: { $ref: "#/components/schemas/FiscalAddress" }
        source: { type: string, enum: [customer_master, free_text] }
        frozen_at: { type: string, format: date-time, nullable: true }
    ComandaReceiptResponse:
      type: object
      description: |
        Receipt payload. Only the identity fields are specified here; every
        pre-04M1 field (including `empresa`, `itens`, `pagamentos`,
        `itens_payment_state` and all money fields) is unchanged and still
        returned.
      properties:
        issuer: { $ref: "#/components/schemas/ReceiptIssuer" }
        issuer_source:
          type: string
          enum: [snapshot, live, live_legacy_fallback]
        customer:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReceiptCustomer" }]
        customer_source:
          type: string
          enum: [snapshot, live, live_legacy_fallback, none]
        customer_id: { type: string, format: uuid, nullable: true }
      additionalProperties: true
    SetComandaCustomerRequest:
      type: object
      description: |
        `action: "set_customer"` — links (or unlinks) the customer of an OPEN
        comanda. Identity-only: it never touches money and never bumps a
        financial total. A finalized comanda is immutable → 409
        `COMANDA_FINALIZED`. A customer of another company → 403
        `CUSTOMER_TENANT_MISMATCH`. `customer_name` is free text, truncated to
        200 characters, used when there is no master customer.
      required: [action, comanda_id]
      properties:
        action: { type: string, enum: [set_customer] }
        comanda_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true }
        customer_name: { type: string, nullable: true, maxLength: 200 }
    SetComandaCustomerResponse:
      type: object
      required: [ok, comanda_id]
      properties:
        ok: { type: boolean, enum: [true] }
        comanda_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, nullable: true }
        customer_name: { type: string, nullable: true }
        customer:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReceiptCustomer" }]
        customer_source:
          type: string
          enum: [customer_master, free_text, none]
        versao: { type: integer }

    # ---------------- 04N1. SERVICE FEE ----------------
    SetComandaServiceFeeRequest:
      type: object
      description: |
        `action: "set_service_fee"` — writes (or removes) the service fee of an
        OPEN comanda. The database is the authority: it computes
        `service_fee` and `total_liquido`; the terminal only declares the
        intent.

        * `mode: "percentage"` — `percentage` (0…100) applied to
          `total_bruto - total_descontos`, BEFORE tax.
        * `mode: "amount"` — fixed `amount` in `comandas.currency`. No FX.
        * `percentage: 0` / `amount: 0` — removes the fee.

        When `mode` is omitted it is INFERRED as `percentage` if `percentage`
        is present, otherwise `amount`. Accepted aliases (part of the public
        terminal contract, kept for the deployed Android build): `modo` for
        `mode`, `percentual` for `percentage`, `valor` for `amount`, `moeda`
        for `currency`, `expected_version` for `expected_comanda_version`.
      required: [action, comanda_id]
      properties:
        action: { type: string, enum: [set_service_fee] }
        comanda_id: { type: string, format: uuid }
        mode:
          type: string
          enum: [percentage, amount]
          description: Alias `modo`. Inferred when absent (see description).
        percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: 'Alias `percentual`. Only for `mode: "percentage"`.'
        amount:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: |
            Alias `valor`. Only for `mode: "amount"`, expressed in
            `comandas.currency` (decimal major units, never minor units).
        currency:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: |
            Alias `moeda`. Optional assertion: when present it MUST equal
            `comandas.currency`, otherwise 422
            `SERVICE_FEE_CURRENCY_MISMATCH`. Never triggers a conversion.
        expected_comanda_version:
          type: integer
          nullable: true
          description: |
            Alias `expected_version`. Compare-and-set against
            `comandas.versao`; mismatch → 409 `STALE_COMANDA_REVISION`. Omit to
            skip the check. This is the ONLY concurrency model — there is no
            parallel/locking protocol on the wire.
    SetComandaServiceFeeResponse:
      type: object
      description: |
        Authoritative money state of the comanda AFTER the mutation. Every
        amount is in `currency` (= `comandas.currency`). The terminal displays
        these values as received and never re-adds or re-rounds them.
      required:
        [ok, comanda_id, currency, service_fee, total_liquido, versao]
      properties:
        ok: { type: boolean, enum: [true] }
        comanda_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/Currency" }
        service_fee_mode:
          type: string
          nullable: true
          enum: [percentage, amount, null]
        service_fee_percent:
          type: number
          nullable: true
          description: Percentage stored for receipt transparency (`amount` mode → null).
        service_fee_percent_base:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`total_bruto - total_descontos` — the base the percentage was applied to."
        subtotal:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`comandas.total_bruto` (merchandise, gross)."
        total_descontos: { $ref: "#/components/schemas/Money" }
        tax_amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Frozen sale tax; never recomputed by this action.
        tax_snapshot:
          type: array
          nullable: true
          description: Frozen tax lines (`name`, `percentage`, `amount`).
          items:
            type: object
            properties:
              name: { type: string }
              percentage: { type: number }
              amount: { $ref: "#/components/schemas/Money" }
            additionalProperties: true
        service_fee: { $ref: "#/components/schemas/Money" }
        total_liquido:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`subtotal - total_descontos + tax_amount + service_fee`."
        total_pago_base: { $ref: "#/components/schemas/Money" }
        saldo_base:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`total_liquido - total_pago_base`."
        versao:
          type: integer
          description: New revision token; one logical mutation = one bump.
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      example: PYG
      description: ISO-4217, uppercase. Immutable once stored. Never converted.

    Money:
      type: number
      description: |
        Decimal JSON number in the currency of the sibling `currency` field.
        Already rounded by the database for that currency (PYG/CLP: 0
        decimals; BRL/USD/EUR: 2). Not minor units.

    # ---------------- 2. CASH SESSION READ ----------------
    CaixaOperacao:
      type: object
      description: |
        A row of `caixa_operacoes` exactly as returned by `select *`
        (response of `abrir` and `sangria`, and each item of `operacoes`).
      properties:
        id: { type: string, format: uuid, description: For `tipo = ABERTURA` this is the `session_id`. }
        user_id: { type: string, format: uuid, description: Tenant (owner) id, resolved from the token. }
        operator_id: { type: string, nullable: true }
        operator_name: { type: string, nullable: true }
        tipo:
          type: string
          enum: [ABERTURA, SANGRIA, FECHAMENTO, SUPRIMENTO, REFORCO, PAY_IN, DEVOLUCAO, ESTORNO_DINHEIRO, CASH_REFUND]
        valor: { $ref: "#/components/schemas/Money" }
        observacao: { type: string, nullable: true }
        caixa_session_id: { type: string, format: uuid, nullable: true, description: NULL on the ABERTURA row itself. }
        branch_id: { type: string, format: uuid, nullable: true }
        currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
          description: |
            Stamped by trigger when absent from the request:
            explicit `currency` → `resumo_json.moeda` →
            `company_default_currency(user_id)`. Never hardcoded BRL.
        resumo_json:
          type: object
          nullable: true
          description: 'Mirrors `moeda`; on FECHAMENTO also `closing_is_not_a_movement: true`.'
        created_at: { type: string, format: date-time }

    CashHistoryResponse:
      type: object
      properties:
        total: { type: integer, description: Number of rows returned (not a money value). }
        operacoes:
          type: array
          items: { $ref: "#/components/schemas/CaixaOperacao" }
        totals_by_currency:
          type: array
          description: Per-currency aggregate of the returned rows. Never summed across currencies.
          items:
            type: object
            properties:
              currency: { type: string, description: '`UNKNOWN` when the row has neither column nor resumo_json currency.' }
              opening: { $ref: "#/components/schemas/Money" }
              withdrawals: { $ref: "#/components/schemas/Money" }
              closing: { $ref: "#/components/schemas/Money" }
              count: { type: integer }

    CashPosition:
      type: object
      description: One row of `caixa_session_cash_position(session_id)` — physical cash only.
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        opening: { $ref: "#/components/schemas/Money" }
        cash_receipts:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Sum of session payments whose method family rounds cash (`payment_method_rounds_cash`). PIX/card are excluded.
        cash_payins:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: '`tipo IN (SUPRIMENTO, REFORCO, PAY_IN)`. Field name is `cash_payins` (not `pay_ins`).'
        withdrawals:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: '`tipo = SANGRIA`.'
        cash_refunds:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: '`tipo IN (DEVOLUCAO, ESTORNO_DINHEIRO, CASH_REFUND)`.'
        expected_cash:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: opening + cash_receipts + cash_payins − withdrawals − cash_refunds, per currency.
      required: [currency, opening, cash_receipts, cash_payins, withdrawals, cash_refunds, expected_cash]

    ClosedPosition:
      type: object
      description: |
        Position line served for a CLOSED session (from the frozen
        `caixa_session_closures` snapshot). Same fields as CashPosition plus
        the count outcome.
      allOf:
        - $ref: "#/components/schemas/CashPosition"
        - type: object
          properties:
            counted_cash:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              nullable: true
              description: NULL = no count declared. 0 = counted and physically zero.
            variance:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              nullable: true
              description: '`counted_cash − expected_cash`. NULL whenever counted_cash is NULL.'

    CashPositionResponse:
      type: object
      description: Response of `GET /api-caixa?cash_position_session_id=<uuid>`.
      properties:
        session_id: { type: string, format: uuid }
        cash_position_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CashPosition" }

    CurrentSessionResponse:
      type: object
      description: |
        Response of `GET /api-caixa?current_session=1`. Authoritative state of
        the drawer, from `public.caixa_current_session`.
      properties:
        session:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SessionSnapshot" }]
          description: |
            `null` when NO session is open for this operator/terminal — that is
            the normal, expected answer, not an error. When present it carries
            `status: OPEN`, `session_id`, `terminal_id`, `opening_currency`,
            `opening_amount`, `movements`, `positions_by_currency` and
            `payments_by_method`.
      required: [session]

    CashMovementResult:
      type: object
      description: |
        Response (201) of `sangria`, `pay_in` and `cash_refund`.
      properties:
        operation_id: { type: string, format: uuid, description: Id of the created `caixa_operacoes` row. }
        session_id: { type: string, format: uuid }
        tipo: { type: string, enum: [SANGRIA, PAY_IN, CASH_REFUND] }
        currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: Always the session currency.
        amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Already rounded by the database for that currency.
        cash_position_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CashPosition" }
          description: Position AFTER the movement, so the terminal never recomputes it.
      required: [operation_id, session_id, tipo, currency, amount]


    PaymentSummaryLine:
      type: object
      description: One line of `caixa_session_payments(session_id)` — ALL methods, cash and non-cash.
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        payment_method:
          type: string
          description: |
            Uppercase `payment_code` when present, else the legacy method /
            `forma` enum, else `UNKNOWN`. Examples seen in production:
            `DINHEIRO`, `CASH`, `PIX_TRANSFERENCIA`, `CARTAO`, `VOUCHER`.
        is_cash: { type: boolean, description: From `payment_method_rounds_cash`. Only these feed `cash_receipts`. }
        count: { type: integer, description: Number of payments in the group (SQL column `cnt`, serialized as `count`). }
        amount: { $ref: "#/components/schemas/Money" }
      required: [currency, payment_method, is_cash, count, amount]

    # ---------------- 7 & 9. PREVIEW / CLOSE SNAPSHOT ----------------
    SessionSnapshot:
      type: object
      description: |
        Payload returned by `preview_fechamento` (action) and by `fechar`.
        While the session is OPEN it is computed live; once CLOSED it is the
        immutable Z snapshot read from `caixa_session_closures` and is never
        recomputed. Two pairs of aliases are deployed and carry identical
        content: `positions_by_currency` == `cash_position_by_currency`, and
        `payments_by_method_and_currency` == `payments_by_method`.
      properties:
        session_id: { type: string, format: uuid }
        operator_id: { type: string, nullable: true, description: Operator that OPENED the session. }
        operator_name: { type: string, nullable: true }
        terminal_id: { type: string, nullable: true, description: From opening `resumo_json.terminal_id`; see CONTRACT_DEBT-6. }
        branch_id: { type: string, format: uuid, nullable: true }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        closed_by: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [OPEN, CLOSED] }
        opening_currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
        opening_amount: { $ref: "#/components/schemas/Money" }
        positions_by_currency:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/CashPosition"
              - $ref: "#/components/schemas/ClosedPosition"
        cash_position_by_currency:
          type: array
          description: Alias of `positions_by_currency` (same array).
          items:
            oneOf:
              - $ref: "#/components/schemas/CashPosition"
              - $ref: "#/components/schemas/ClosedPosition"
        payments_by_method_and_currency:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummaryLine" }
        payments_by_method:
          type: array
          description: Alias of `payments_by_method_and_currency` (same array).
          items: { $ref: "#/components/schemas/PaymentSummaryLine" }
        movements:
          type: array
          description: Every cash movement of the session, oldest first (opening row included).
          items:
            type: object
            properties:
              operation_id: { type: string, format: uuid }
              type: { type: string }
              currency: { allOf: [{ $ref: "#/components/schemas/Currency" }], nullable: true }
              amount: { $ref: "#/components/schemas/Money" }
              reason: { type: string, nullable: true, description: '`observacao` of the operation.' }
              operator_id: { type: string, nullable: true }
              operator_name: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        closure_snapshot:
          type: array
          description: |
            Raw `caixa_session_closures` rows (minus `owner_user_id`), one per
            currency; `[]` while the session is OPEN. This is the immutable Z
            record: session_id, closure_op_id, currency, opening,
            cash_receipts, cash_payins, withdrawals, cash_refunds,
            expected_cash, counted_cash, variance, payments_by_method,
            opened_at, closed_at, closed_by, operator_name.
          items: { type: object }
        already_closed:
          type: boolean
          description: Present only on `fechar`. `false` = closed now (201), `true` = was already closed (200).
        closure_op_id:
          type: string
          format: uuid
          description: Present only on `fechar`. Id of the FECHAMENTO row (`valor = 0`).

    # ---------------- 3. OPENING ----------------
    AbrirRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [abrir] }
        valor:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          default: 0
          description: |
            Physical opening float. Optional; defaults to 0. Must be finite,
            >= 0 and <= 1e12, else 422 `INVALID_AMOUNT`.
        moeda:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
          description: |
            Currency field name for opening is **`moeda`** (not `currency`).
            Uppercased by the API and validated against the currencies ENABLED
            for the company, else 422 `INVALID_CURRENCY`. When omitted/empty
            the company default currency is used (never a hardcoded BRL).
        terminal_id:
          type: string
          nullable: true
          description: |
            Optional. Falls back to `X-Terminal-Id`, then `X-Device-Id`.
            Persisted on the opening and inherited by every movement.
        branch_id: { type: string, format: uuid, nullable: true }
        observacao: { type: string, default: "" }
      description: |
        Returns the opened session (201) — `session_id` is the id used by all
        later calls. Idempotent with `Idempotency-Key`. While a session is
        already open for this operator a second call returns 409
        `CASH_SESSION_ALREADY_OPEN` carrying the open `session_id`.

    # ---------------- 5. CASH MOVEMENTS ----------------
    SangriaRequest:
      type: object
      required: [action, session_id, valor]
      properties:
        action: { type: string, enum: [sangria] }
        session_id: { type: string, format: uuid, description: Id of the ABERTURA row. }
        valor:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Must be > 0, else 422 `INVALID_AMOUNT`.
        moeda:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
          description: |
            Optional. When omitted the movement INHERITS the session currency.
            When sent it MUST equal the session currency, else 422
            `CASH_CURRENCY_MISMATCH`.
        reference: { type: string, nullable: true, description: Free external reference (sale id, voucher, envelope). }
        observacao: { type: string, default: "", description: Reason; surfaces as `reason` in `movements`. }
      description: |
        Cash LEAVING the drawer (withdrawal to safe/deposit). Returns
        `CashMovementResult` (201). Idempotent with `Idempotency-Key`.
        Errors: 404 `CASH_SESSION_NOT_FOUND`, 409 `CASH_SESSION_CLOSED`.

    PayInRequest:
      allOf: [{ $ref: "#/components/schemas/SangriaRequest" }]
      properties:
        action: { type: string, enum: [pay_in] }
      description: |
        Cash ENTERING the drawer that is not a sale (reforço/suprimento de
        troco). Recorded as `tipo = 'PAY_IN'` and ADDED to `expected_cash`.
        Same fields, validation and idempotency as `sangria`.

    CashRefundRequest:
      allOf: [{ $ref: "#/components/schemas/SangriaRequest" }]
      properties:
        action: { type: string, enum: [cash_refund] }
      description: |
        Cash handed BACK to a customer. Recorded as `tipo = 'CASH_REFUND'` and
        SUBTRACTED from `expected_cash`. It is a drawer fact only — it never
        reverses a sale, a payment or a fiscal document. Use `reference` to
        point at the sale it relates to.

    # ---------------- 7. CLOSING PREVIEW ----------------
    PreviewFechamentoRequest:
      type: object
      required: [action, session_id]
      properties:
        action: { type: string, enum: [preview_fechamento] }
        session_id: { type: string, format: uuid }
      description: |
        Canonical way the terminal obtains the closing preview: it returns the
        full `SessionSnapshot` (positions per currency with `expected_cash`,
        payments by method+currency, movements, session metadata).
        `GET ?cash_position_session_id=` also exists but returns ONLY
        `cash_position_by_currency` — no payment summary, no metadata.

    # ---------------- 8. CLOSE REQUEST ----------------
    FecharRequest:
      type: object
      required: [action, session_id]
      properties:
        action: { type: string, enum: [fechar] }
        session_id: { type: string, format: uuid }
        observacao: { type: string, default: "" }
        counted_by_currency:
          type: array
          nullable: true
          default: null
          description: |
            Physical count declaration, per currency. Deployed semantics —
            do NOT collapse them:

            * field omitted / `null`  → NO count declared for any currency.
              Every closure row gets `counted_cash = null`, `variance = null`.
            * entry with `counted_amount: null` (also `undefined` or `""`) →
              that currency is skipped, i.e. NO count declared for it →
              `counted_cash = null`, `variance = null`.
            * entry with `counted_amount: 0` → count DECLARED as physically
              zero → `counted_cash = 0`, `variance = 0 − expected_cash`.
            * a currency absent from the array → no count declared for it.

            Validation: not an array → 422 `COUNTED_INVALID`; currency not
            matching `^[A-Z]{3}$` → 422 `COUNTED_CURRENCY_INVALID`;
            non-finite or negative amount → 422 `COUNTED_AMOUNT_INVALID`.
            Amounts are matched to positions by uppercase currency.
          items:
            type: object
            required: [currency]
            properties:
              currency: { $ref: "#/components/schemas/Currency" }
              counted_amount:
                allOf: [{ $ref: "#/components/schemas/Money" }]
                nullable: true
      description: |
        Closing inserts one `FECHAMENTO` row with `valor = 0` (never a cash
        movement) and freezes one `caixa_session_closures` row per currency.
        201 on first close, 200 with `already_closed: true` afterwards
        (convergent, no key needed).

    # ---------------- 6. PAY-BY-ITEMS (PILOT-STAB-04H / 04H1) ----------------
    PaidItem:
      type: object
      description: |
        One selected allocation. Identity is `comanda_item_id` + `quantity`
        — never product id or product name. Accepted aliases (deployed in
        `normalizePaidItems`): `comanda_item_id` | `item_id`, and
        `quantity` | `qtd` | `paid_quantity`. The array itself may arrive as
        `items` | `itens_pagos` | `paid_items`.
      required: [comanda_item_id, quantity]
      properties:
        comanda_item_id: { type: string, format: uuid }
        quantity:
          type: number
          exclusiveMinimum: 0
          description: |
            Quantity being paid now, ≤ remaining quantity of that line.
            A line with `qtd = 2` may be paid `1` then `1`.

    PaymentQuoteRequest:
      type: object
      description: |
        `action: "payment_quote"` — pure read. Never send an amount: there is
        no `valor`/`valor_base` field in this contract, and any amount would
        be ignored. No `Idempotency-Key`, no financial effect.
      required: [action, comanda_id, items]
      properties:
        action: { type: string, enum: [payment_quote] }
        comanda_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PaidItem" }
        forma:
          type: string
          default: DINHEIRO
          description: |
            Payment method, needed ONLY to compute the physical tender.
            Enum `DINHEIRO | CARTAO | PIX_TRANSFERENCIA | VOUCHER | OUTRO`,
            with terminal aliases normalised server-side (`PIX`, `CASH`,
            `EFECTIVO`, `CARD`, `TARJETA`, `CREDITO`, `DEBITO`, `QR`,
            `TICKET`, `VALE`, `OTHER`, …). Unknown value → 422
            `PAYMENT_METHOD_INVALID`.
        moeda:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
          description: |
            Payment (transaction) currency. Omit/`null` = the comanda currency.
            Cross-currency requires an FX rate, else 422 `FX_RATE_MISSING`.

    PaymentQuoteLine:
      type: object
      description: Per-line authoritative allocation (element of `items`).
      properties:
        comanda_item_id: { type: string, format: uuid }
        nome_snapshot: { type: string }
        paid_quantity: { type: number }
        unit_price: { $ref: "#/components/schemas/Money" }
        item_subtotal: { $ref: "#/components/schemas/Money" }
        allocated_discount: { $ref: "#/components/schemas/Money" }
        allocated_tax: { $ref: "#/components/schemas/Money" }
        allocated_service: { $ref: "#/components/schemas/Money" }
        coverage_amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`item_subtotal - allocated_discount + allocated_tax + allocated_service`."
        currency: { $ref: "#/components/schemas/Currency" }

    PaymentQuoteResponse:
      type: object
      description: |
        Verbatim output of `public.comanda_items_payment_quote`. Every money
        field is already rounded by the database. The terminal MUST display
        and send these values, never recompute them.

        Physical example (PYG comanda 39.440 + IVA 10% = 43.384):
        Heineken x1 → `item_subtotal` 11600, `allocated_tax` 1160,
        `accounting_total` 12760. Coca x1 → 6960 / 696 / 7656.
        Cachorro x1 → 20880 / 2088 / 22968. Sum = 43384 exactly.
      properties:
        comanda_id: { type: string, format: uuid }
        currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: Comanda (accounting) currency.
        items:
          type: array
          items: { $ref: "#/components/schemas/PaymentQuoteLine" }
        item_subtotal: { $ref: "#/components/schemas/Money" }
        allocated_discount: { $ref: "#/components/schemas/Money" }
        allocated_tax: { $ref: "#/components/schemas/Money" }
        allocated_service: { $ref: "#/components/schemas/Money" }
        accounting_total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: |
            Authoritative accounting coverage in `currency`. This is what the
            comanda balance is reduced by — NOT the cash tender.
        comanda_total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`comandas.total_liquido` (subtotal − discount + tax + service)."
        payable_subtotal: { $ref: "#/components/schemas/Money" }
        paid_subtotal_before: { $ref: "#/components/schemas/Money" }
        settles_full_comanda:
          type: boolean
          description: True when this selection covers every payable quantity.
        transaction_currency: { $ref: "#/components/schemas/Currency" }
        fx_rate: { type: number }
        fx_source: { type: string, description: "`identity`, snapshot, company rate or inverse." }
        transaction_amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`accounting_total` expressed in `transaction_currency`."
        cash_tender:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: |
            PHYSICAL amount to collect. Equals `transaction_amount` for every
            non-cash method. For `DINHEIRO` it is
            `round_cash_for_payment(transaction_amount, …)` — e.g. PYG
            increment 50: accounting 22968 → tender 22950, diff −18, while
            comanda coverage stays 22968.
        cash_rounding_diff:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "`cash_tender - transaction_amount`. Always 0 for non-cash."

    ItemsCheckoutCommitRequest:
      type: object
      description: |
        `action: "checkout_commit"` in ITEMS mode. Requires headers
        `Idempotency-Key` and `X-Device-Id`.

        **Deployed behaviour of the legacy amount fields (normative):**
        * `valor` — OPTIONAL LEGACY. When `items` is present the server
          recomputes the authoritative amount and OVERWRITES `valor` with
          `transaction_amount`. If a non-null `valor` is sent and, once
          rounded to the transaction currency, it is neither
          `transaction_amount` nor `cash_tender`, the request is REFUSED with
          422 `ITEMS_AMOUNT_MISMATCH` (no payment, no allocation).
          Omitting it (the default `0` is treated as sent) is not required;
          the safest terminal behaviour is to send the `cash_tender` /
          `transaction_amount` returned by `payment_quote`, or nothing.
        * `valor_base` — OPTIONAL LEGACY, validated only: it must equal the
          authoritative `accounting_base` or the derived `calculated_base`,
          else 422 `MONEY_AMOUNT_MISMATCH`. It NEVER sets the amount.
        * `moeda` — REQUIRED (422 `TRANSACTION_CURRENCY_REQUIRED`). There is
          no implicit BRL.
      required: [action, comanda_id, items, moeda]
      properties:
        action: { type: string, enum: [checkout_commit] }
        comanda_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PaidItem" }
        forma: { type: string, default: DINHEIRO }
        moeda: { $ref: "#/components/schemas/Currency" }
        valor:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: Optional legacy echo — validated, then overwritten. Not authority.
        valor_base:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: Optional legacy echo in the comanda currency — validated only.
        base_currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          nullable: true
          description: If sent, must equal the comanda currency (422 `BASE_CURRENCY_MISMATCH`).
        exchange_rates_snapshot:
          type: object
          nullable: true
          description: Optional FX snapshot consulted first by `resolve_fx_rate`.
        referencia_externa: { type: string, description: Provider/correlation reference. }

    PaymentAllocationRow:
      type: object
      description: Persisted row of `public.comanda_payment_allocations`.
      properties:
        id: { type: string, format: uuid }
        pagamento_id: { type: string, format: uuid }
        comanda_item_id: { type: string, format: uuid }
        paid_quantity: { type: number }
        unit_price: { $ref: "#/components/schemas/Money" }
        line_amount: { $ref: "#/components/schemas/Money" }
        allocated_discount: { $ref: "#/components/schemas/Money" }
        allocated_tax: { $ref: "#/components/schemas/Money" }
        allocated_service: { $ref: "#/components/schemas/Money" }
        coverage_amount: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }

    ItemsCheckoutCommitResponse:
      type: object
      description: |
        Verbatim result of `public.commit_comanda_checkout_idempotent`. The
        terminal must NOT reconstruct any of these values.
      properties:
        outcome:
          type: string
          enum: [new, replay, recovered, reconciliation, error, conflict]
        operation_id:
          type: string
          format: uuid
          description: "`terminal_operations.id` for this Idempotency-Key."
        payment_id: { type: string, format: uuid, description: "`pagamentos_comanda.id`." }
        sale_id:
          type: string
          format: uuid
          nullable: true
          description: Set only when this payment closed the comanda (one sale per comanda).
        comanda_id: { type: string, format: uuid }
        base_currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: Comanda/accounting currency.
        transaction_currency: { $ref: "#/components/schemas/Currency" }
        fx_rate: { type: number }
        fx_source: { type: string }
        valor:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: PERSISTED physical value in `transaction_currency` (cash tender when CASH).
        cash_rounding_diff: { $ref: "#/components/schemas/Money" }
        valor_base:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: Legacy derived base value; `null` in ITEMS mode.
        accounting_base:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Authoritative coverage applied to the comanda (= `accounting_total`).
        total_liquido: { $ref: "#/components/schemas/Money" }
        total_pago_base: { $ref: "#/components/schemas/Money" }
        saldo_base:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Remaining balance in `base_currency` after this payment.
        closed:
          type: boolean
          description: True when the comanda was closed (table released, sale registered).
        allocation:
          type: object
          description: |
            Result of `allocate_comanda_payment_items`: `{ applied, skipped,
            allocations: [PaymentAllocationRow], quote }`.
          properties:
            applied: { type: boolean }
            skipped: { type: boolean, description: True on replay — no duplicate allocation. }
            allocations:
              type: array
              items: { $ref: "#/components/schemas/PaymentAllocationRow" }
        receipt:
          type: object
          description: |
            `comanda_payment_receipt_items` — per-line receipt detail
            (`comanda_item_id`, `paid_quantity`, `item_subtotal`,
            `allocated_tax`, `allocated_service`, `allocated_discount`,
            `coverage_amount`, `accounting_base`).
        money_divergence: { type: boolean }

    ComandaCodedError:
      type: object
      description: |
        Typed business error of `/api-comandas`. Item-payment, currency and
        method errors always carry `code` AND `message_key`
        (`comanda.error.<code lowercased>`), so the terminal never has to
        show a raw English string.
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - ALLOCATION_PAYLOAD_INVALID
            - ALLOCATION_ITEMS_REQUIRED
            - ALLOCATION_ITEM_NOT_IN_COMANDA
            - ALLOCATION_ITEM_NOT_PAYABLE
            - ALLOCATION_QUANTITY_INVALID
            - ALLOCATION_EXCEEDS_ITEM_QUANTITY
            - ALLOCATION_NO_PAYABLE_ITEMS
            - ALLOCATION_PAYMENT_NOT_FOUND
            - ITEMS_AMOUNT_MISMATCH
            - MONEY_AMOUNT_MISMATCH
            - TRANSACTION_CURRENCY_REQUIRED
            - BASE_CURRENCY_MISMATCH
            - COMANDA_CURRENCY_MISSING
            - FX_RATE_MISSING
            - PAYMENT_METHOD_INVALID
            - ENUM_VALUE_INVALID
            - COMANDA_NOT_FOUND
            - COMANDA_CANCELLED
            - COMANDA_ALREADY_CLOSED
            - INSUFFICIENT_STOCK
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_CONFLICT
            - DEVICE_REQUIRED
            - device_id_invalid
            - device_not_registered
            - device_check_failed
            - DEVICE_BLOCKED
            - TENANT_DEVICE_MISMATCH
            - TENANT_MISMATCH
            - FORBIDDEN_TENANT
            - UPGRADE_REQUIRED
            - SERVICE_FEE_MODE_INVALID
            - SERVICE_FEE_PERCENT_INVALID
            - SERVICE_FEE_AMOUNT_INVALID
            - SERVICE_FEE_CURRENCY_MISMATCH
            - SERVICE_FEE_LOCKED_BY_ALLOCATION
            - SERVICE_FEE_BELOW_SETTLED
            - SERVICE_FEE_FAILED
            - COMANDA_NOT_EDITABLE
            - COMANDA_FINALIZED
            - STALE_COMANDA_REVISION
            - IDEMPOTENCY_KEY_REUSED
            - OPERATION_IN_PROGRESS
            - OWNER_COMANDA_REQUIRED
        message_key:
          type: string
          example: comanda.error.allocation_exceeds_item_quantity
        expected_accounting_base: { $ref: "#/components/schemas/Money" }
        expected_transaction_amount: { $ref: "#/components/schemas/Money" }
        expected_cash_tender: { $ref: "#/components/schemas/Money" }
        client_amount: { $ref: "#/components/schemas/Money" }
        allocation_preview: { $ref: "#/components/schemas/PaymentQuoteResponse" }
        requires_reconciliation: { type: boolean }

    # ---------------- 04L1. AUTH LOGIN ----------------
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Trimmed and lower-cased by the server before authentication.
        password: { type: string, format: password }

    AuthLoginUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        full_name: { type: string, nullable: true, description: From `user_metadata.full_name`. }

    AuthLoginOperationModes:
      type: object
      description: Operation modes enabled for this operator/company. Defaults to `true` when unset.
      properties:
        mesa: { type: boolean }
        venda_direta: { type: boolean }
        comanda: { type: boolean }

    AuthLoginDevice:
      type: object
      nullable: true
      description: |
        `null` when no `X-Device-Id` header was sent (or auto-registration
        failed). Present devices are always owned by `owner_id` and not blocked —
        otherwise the request would have been refused with 403.
      properties:
        id: { type: string }
        api_version: { type: integer, nullable: true }
        blocked: { type: boolean }

    AuthLoginCashier:
      type: object
      description: |
        Authoritative cashier state at login time. Derived from the existing
        `public.caixa_current_session` authority (via
        `public.terminal_login_bootstrap`) — NEVER inferred from the history of
        `caixa_operacoes`. This block exists solely to remove the second login
        round trip; it adds no cash business rule. Cash semantics (session
        identity, currency immutability, no FX, rounding) stay defined by
        `/api-caixa` in this same contract and MUST NOT be duplicated here.
      required: [is_open, session_id, session, available]
      properties:
        is_open:
          type: boolean
          description: |
            `true` if and only if an authoritative open session exists.
            No session / closed drawer → `false`.
        session_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Id of the authoritative open session (the `ABERTURA` row).
            `null` whenever `is_open` is `false`.
        session:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SessionSnapshot" }]
          description: |
            The authoritative current-session object, identical in shape to
            `GET /api-caixa?current_session=1` → `session`. `null` when closed.
        available:
          type: boolean
          description: |
            PILOT-STAB-04L3. `true` if and only if the authoritative
            cash-session read actually succeeded (`cashier_available` of
            `terminal_login_bootstrap`). It is NOT hardcoded. A read failure is
            never represented as an open drawer, and "could not determine" is
            never reported as closed: the bootstrap failure path returns 503
            `LOGIN_BOOTSTRAP_FAILED` instead of a 200. On a 200 with
            `available: false`, cash state is UNKNOWN — `is_open` is `false`
            only as a fail-closed placeholder and the terminal MUST re-read
            `/api-caixa?current_session=1` before operating cash.


    AuthLoginResponse:
      type: object
      description: Deployed success payload of `POST /auth-login`.
      required:
        [access_token, refresh_token, expires_in, token_type, user, owner_id,
         operation_modes, device, mesa, venda_direta, comanda, cashier, request_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        token_type: { type: string, enum: [Bearer] }
        user: { $ref: "#/components/schemas/AuthLoginUser" }
        owner_id:
          type: string
          format: uuid
          description: |
            Canonical tenant id: the real owner, or the `owner_user_id` of the
            company when the authenticated account is a sub-user. All terminal
            data is scoped by this id.
        operation_modes: { $ref: "#/components/schemas/AuthLoginOperationModes" }
        device: { $ref: "#/components/schemas/AuthLoginDevice" }
        mesa: { type: boolean, description: Convenience mirror of `operation_modes.mesa`. }
        venda_direta: { type: boolean, description: Convenience mirror of `operation_modes.venda_direta`. }
        comanda: { type: boolean, description: Convenience mirror of `operation_modes.comanda`. }
        cashier: { $ref: "#/components/schemas/AuthLoginCashier" }
        request_id:
          type: string
          format: uuid
          description: Same value as the `X-Request-Id` response header; use it in support tickets.

    AuthLoginError:
      type: object
      description: Login refusal with a machine-readable `reason` (no `code`).
      required: [error, reason]
      properties:
        error: { type: string }
        reason:
          type: string
          enum:
            - MISSING_FIELDS
            - INVALID_CREDENTIALS
            - EMAIL_NOT_CONFIRMED
            - USER_BANNED
            - USER_INACTIVE
            - USER_BLOCKED

    AuthLoginDeviceError:
      type: object
      description: Device refusal — `error` and `code` carry the same value.
      required: [error, code]
      properties:
        error: { type: string, enum: [device_owner_mismatch, DEVICE_BLOCKED] }
        code: { type: string, enum: [device_owner_mismatch, DEVICE_BLOCKED] }

    PlainError:
      type: object
      description: Untyped error — `error` only, NO `code`, NO `message_key` (CONTRACT_DEBT-4).
      properties:
        error: { type: string }
        session_id: { type: string, format: uuid, description: Only on "already open session". }

    CodedError:
      type: object
      description: Typed error.
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - COUNTED_INVALID
            - COUNTED_CURRENCY_INVALID
            - COUNTED_AMOUNT_INVALID
            - CASH_SESSION_NOT_FOUND
            - LOGIN_BOOTSTRAP_FAILED
            - FORBIDDEN_TENANT
            - UPGRADE_REQUIRED

# =====================================================================
# 6. CASH REFUND — relationship, not an invented action
# =====================================================================
x-cash-refund:
  terminal_endpoint: none deployed (CONTRACT_DEBT-3)
  how_it_reaches_the_cash_position: |
    `caixa_session_cash_position` subtracts `caixa_operacoes` rows of the
    session whose `tipo IN ('DEVOLUCAO','ESTORNO_DINHEIRO','CASH_REFUND')`
    into `cash_refunds`. Those rows are inserted by ERP/back-office and
    internal paths, not by any `api-caixa` action. A cash refund tied to a
    sale/comanda reversal therefore appears in the terminal's Z report only
    through this position line.
  non_cash_refunds: |
    Non-cash reversals never touch `expected_cash`; they are visible only in
    the payment summary of the underlying sale/comanda.

# =====================================================================
# How session payments reach the session (2 & 9)
# =====================================================================
x-payment-session-binding:
  mechanism: |
    `sales.caixa_session_id` and `pagamentos_comanda.caixa_session_id` are
    stamped by database triggers at insert time using
    `current_caixa_session(owner, operator)`, and are immutable afterwards.
    The terminal never sends `caixa_session_id` on a sale or payment.
  summary_source: |
    `caixa_session_payments(session_id)` = sales of the session (excluding
    `status = 'cancelled'`, amount = `cash_amount_due` when present else
    `total`) UNION comanda payments with `status = 'CONFIRMADO'` that are not
    yet materialized as a sale (avoids double counting).
    Cash currency of a sale = `payment_currency` when set, else
    `sales.currency`.

# =====================================================================
# 14b. TRANSACTION CURRENCY AUTHORITY (PILOT-STAB-03B.7D)
# =====================================================================
x-transaction-currency-authority:
  principle: |
    A sale has THREE currencies and they are not interchangeable:
      * base currency      — company/catalog currency (`products.price_currency`,
                             `owner_base_currency`). Where the price is stored.
      * transaction currency — the currency the operator is selling in. Decides
                             price shown, TAX rows applied, subtotal and total.
                             Persisted in `sales.currency`.
      * settlement currency — how the customer pays (`sales.payment_currency`).
                             Decides `converted_total` and cash rounding.
  wire_contract:
    endpoint: "POST /functions/v1/api-vendas"
    field: transaction_currency
    type: "string, 3-letter ISO 4217, optional"
    semantics: |
      When sent, the database converts each catalog price into that currency via
      `product_transaction_price()` (authoritative rate: sale snapshot > company
      rate > inverse), applies only the tax rows registered for that currency,
      and persists `sales.currency = transaction_currency`.
      When omitted (legacy published app), the database falls back to the
      company default currency. No behaviour change for existing clients.
    defaults: |
      `payment_currency` defaults to `transaction_currency` when not sent.
    errors:
      - code: TRANSACTION_CURRENCY_INVALID
        http: 422
      - code: TRANSACTION_CURRENCY_NOT_ENABLED
        http: 422
        note: "currency must exist in company_currencies with is_enabled = true"
  audit_trail: |
    `sale_items` persists `base_currency`, `base_unit_price`, `fx_rate_used`,
    `fx_rate_source` next to `unit_price` (already in transaction currency), so
    the conversion that produced each line is reproducible.
  never: |
    The terminal never sends prices, taxes or totals. Amounts sent by the client
    for those fields are ignored; the database recomputes them.
  example:
    request:
      transaction_currency: PYG
      payment_method: DINHEIRO
      exchange_rates_snapshot: { PYG: 1160 }
      itens: [{ produto_id: "<uuid>", qtd: 1 }]
    persisted:
      currency: PYG
      subtotal: 20880
      tax_amount: 2088
      tax_snapshot: [{ name: IVA, percentage: 10, amount: 2088 }]
      total: 22968
      cash_amount_due: 22950
      cash_rounding_diff: -18
      sale_item: { unit_price: 20880, base_currency: BRL, base_unit_price: 18, fx_rate_used: 1160, fx_rate_source: sale_snapshot }



# =====================================================================
# 15. EXAMPLES (safe, no FX, no BRL)
# =====================================================================
x-examples:
  session_A_opening_and_withdrawal_only:
    steps:
      - request: { action: abrir, valor: 15000, moeda: PYG }
      - request: { action: sangria, session_id: "<session>", valor: 5000, observacao: "Sangria" }
    preview_response:
      status: OPEN
      positions_by_currency:
        - currency: PYG
          opening: 15000
          cash_receipts: 0
          cash_payins: 0
          withdrawals: 5000
          cash_refunds: 0
          expected_cash: 10000
      payments_by_method: []

  session_B_cash_and_pix:
    steps:
      - request: { action: abrir, valor: 15000, moeda: PYG }
      - note: cash sale PYG 20000 (stamped to the session by trigger)
      - note: PIX sale PYG 30000 (stamped to the session by trigger)
      - request: { action: sangria, session_id: "<session>", valor: 5000 }
    preview_response:
      status: OPEN
      positions_by_currency:
        - currency: PYG
          opening: 15000
          cash_receipts: 20000
          cash_payins: 0
          withdrawals: 5000
          cash_refunds: 0
          expected_cash: 30000
      payments_by_method:
        - { currency: PYG, payment_method: DINHEIRO, is_cash: true, count: 1, amount: 20000 }
        - { currency: PYG, payment_method: PIX_TRANSFERENCIA, is_cash: false, count: 1, amount: 30000 }
    close_request:
      action: fechar
      session_id: "<session>"
      counted_by_currency: [{ currency: PYG, counted_amount: 30000 }]
    close_response_excerpt:
      status: CLOSED
      already_closed: false
      positions_by_currency:
        - currency: PYG
          opening: 15000
          cash_receipts: 20000
          cash_payins: 0
          withdrawals: 5000
          cash_refunds: 0
          expected_cash: 30000
          counted_cash: 30000
          variance: 0
